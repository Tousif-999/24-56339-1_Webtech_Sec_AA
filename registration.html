<!DOCTYPE html>
<html>

<head>

    <title>Library Membership Registration</title>

    <link rel="icon"
          href="https://cdn-icons-png.flaticon.com/512/2232/2232688.png">

</head>

<body>

    <h1>Library Membership Registration</h1>

    <p>
        Please fill up the form to become a
        <b>library member</b>.
    </p>

    <form action="" method="GET">

        <label for="name">Name:</label>

        <input type="text"
               id="name"
               name="name"
               required>

        <br><br>


        <label for="email">Email:</label>

        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>


        <label for="password">Password:</label>

        <input type="password"
               id="password"
               name="password"
               required>

        <br><br>


        <label for="age">Age:</label>

        <input type="number"
               id="age"
               name="age"
               required>

        <br><br>


        <label for="dob">Date of Birth:</label>

        <input type="date"
               id="dob"
               name="dob"
               required>

        <br><br>


        <label>Gender:</label>

        <input type="radio"
               id="male"
               name="gender"
               value="Male"
               required>

        <label for="male">Male</label>


        <input type="radio"
               id="female"
               name="gender"
               value="Female">

        <label for="female">Female</label>


        <input type="radio"
               id="other"
               name="gender"
               value="Other">

        <label for="other">Other</label>

        <br><br>


        <label for="membership">
            Membership Type:
        </label>

        <select id="membership"
                name="membership"
                required>

            <option value="">
                Select Membership
            </option>

            <option value="Regular">
                Regular
            </option>

            <option value="Premium">
                Premium
            </option>

            <option value="Student">
                Student
            </option>

        </select>

        <br><br>


        <label for="profile">
            Upload Profile Picture:
        </label>

        <input type="file"
               id="profile"
               name="profile">

        <br><br>


        <label for="address">
            Address:
        </label>

        <br>

        <textarea id="address"
                  name="address"
                  rows="5"
                  cols="40"
                  placeholder="Enter your address"
                  required></textarea>

        <br><br>


        <input type="checkbox"
               id="terms"
               name="terms"
               value="Accepted"
               required>

        <label for="terms">
            I agree to the library terms and conditions.
        </label>

        <br><br>


        <input type="submit"
               value="Register">

    </form>

    <br><br>

    <a href="index.html">
        Back to Library Member Profile
    </a>

</body>

</html>
